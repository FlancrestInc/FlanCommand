services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      FLANC_COMMAND_START: "1"
      FLANC_COMMAND_HOST: "0.0.0.0"
      FLANC_STORAGE_ROOT: /workspace/storage
      FLANC_ALLOWED_ORIGINS: "https://hermes.flan.party,http://192.168.22.245:3456"
      HERMES_MAX_FRAME_BYTES: "33554432"
      PORT: "3000"
    volumes:
      - flancommand-storage:/workspace/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  flancommand-storage:
